<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Covey Brown Photography</title>
<meta name="description" content="Covey Brown Photography">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&display=swap">
<style>
  :root {
    --bg: #000;
    --fg: #f2f2f0;
    --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    display: grid;
    place-items: center;
    padding-inline: 16px;
    box-sizing: border-box;
  }
  h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 300;
    font-size: clamp(1.75rem, 6vw, 3.5rem);
    letter-spacing: 0.04em;
    text-align: center;
    text-wrap: balance;
    animation: fade 1.6s ease-out both;
  }
  @keyframes fade { from { opacity: 0.001; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { h1 { animation: none; } }
</style>
</head>
<body>
<h1>Covey Brown Photography</h1>
</body>
</html>
