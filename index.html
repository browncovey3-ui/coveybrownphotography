<!doctype html>
<!-- Tells the browser this is a modern HTML page. Always the first line. -->

<html lang="en">
<!-- lang="en" tells browsers and screen readers the page is in English. -->

<head>
  <!-- The <head> holds information ABOUT the page. Nothing here is
       shown on the page itself (except the <title>, in the browser tab). -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Covey Brown Photography</title>
  <meta name="description" content="Covey Brown Photography">

  <!-- Load the Cormorant Garamond font from Google Fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&display=swap">

  <!-- Link to the shared stylesheet. Every page has this same line,
       so they all look alike. "css/style.css" is a RELATIVE path:
       "go into the css folder, open style.css". -->
  <link rel="stylesheet" href="css/style.css">
</head>

<!-- class="home" lets the stylesheet treat the home page a little
     differently from the other pages. -->
<body class="home">

  <!-- <main> holds the page's main content. Use one per page. -->
  <main class="splash">
    <!-- <h1> is the most important heading. Use one per page. -->
    <h1>Covey Brown Photography</h1>

    <!-- <nav> marks a group of links for getting around the site.
         The links live in a list (<ul> = unordered list, <li> = list item)
         because a menu is a list of choices. -->
    <nav aria-label="Main">
      <ul class="nav-links">
        <li><a href="portfolio.html">Portfolio</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </main>

  <!-- <footer> sits at the bottom of the page. &copy; makes the © symbol. -->
  <footer class="site-footer">
    <p>&copy; 2026 Covey Brown</p>
  </footer>

</body>
</html>
